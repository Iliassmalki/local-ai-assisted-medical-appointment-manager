spring.application.name=gestion rendez-vousmedic

# Loads .env from the project root when present (git-ignored, never committed).
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8787}

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appointment}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

# ── Security ─────────────────────────────────────────────────────────────────
# Base64-encoded HMAC key, 256 bits or more. Required: the application refuses to
# start without it, so a build can never fall back to a shared default.
#   openssl rand -base64 32
security.jwt.secret-key=${JWT_SECRET_KEY}
# Access token: 1 hour. Refresh token: 7 days.
security.jwt.expiration-time=${JWT_EXPIRATION_MS:3600000}
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Assistant (optional) ─────────────────────────────────────────────────────
# Requires a local Ollama runtime. Without it the assistant endpoint returns 500
# and the UI reports it as unavailable; every other feature is unaffected.
assistant.base-url=${ASSISTANT_BASE_URL:http://localhost:11434}
assistant.model=${ASSISTANT_MODEL:mistral}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}

# Grounding text for the assistant prompt. Override with WEBSITE_INFO.
website.info=${WEBSITE_INFO:Le système permet aux patients de réserver, modifier ou annuler des rendez-vous médicaux via une interface web intuitive. Nous sommes ouverts tous les jours de 9h à 18h. Dans ce site vous pouvez réserver, gérer et consulter vos rendez-vous. Toutes les fonctionnalités du site nécessitent une connexion. Un médecin peut refuser votre rendez-vous s'il n'est pas disponible.}
