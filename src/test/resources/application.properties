# Test configuration. Overrides the values the application normally takes from the
# environment so the suite runs with no MySQL server, no Ollama and no real secrets.

spring.datasource.url=jdbc:h2:mem:medora;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Test-only signing key. Not used by any deployed environment.
security.jwt.secret-key=bWVkb3JhLXVuaXQtdGVzdC1zaWduaW5nLWtleS0yNTZiaXRzISE=
security.jwt.expiration-time=3600000
security.jwt.refresh-expiration-time=604800000

assistant.base-url=http://localhost:11434
assistant.model=mistral
website.info=Texte de test pour l'assistant.
